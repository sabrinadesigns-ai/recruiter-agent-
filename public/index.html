<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>Chat with Sabrina's AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --accent: #e91e63;
    --accent-light: #fce4ec;
    --bg: #fffbfa;
    --bubble-user: #e91e63;
    --bubble-agent: #fdeef1;
    --text-dark: #1a1a1a;
    --text-light: #ffffff;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
  }
  #chat-container {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .msg strong {
    font-weight: 700;
    color: var(--accent);
  }
  .msg em {
    font-style: italic;
  }
  .msg a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: underline;
    word-break: break-word;
  }
  .msg.user a {
    color: #ffffff;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--text-light);
    border-bottom-right-radius: 4px;
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--bubble-agent);
    color: var(--text-dark);
    border-bottom-left-radius: 4px;
  }
  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-agent);
    color: #888;
    font-style: italic;
  }
  #starter-questions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 16px 12px;
  }
  .starter-btn {
    background: #fff;
    border: 1px solid #d0d5dd;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--accent);
  }
  .starter-btn:hover { background: #f5faff; }
  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 16px 4px 16px;
    align-self: flex-start;
    max-width: 80%;
  }
  .quick-reply-btn {
    background: #fff;
    border: 1.5px solid var(--accent);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--accent);
  }
  .quick-reply-btn:hover { background: var(--accent-light); }
  #input-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #e5e7eb;
  }
  #input-row input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 24px;
    border: 1px solid #d0d5dd;
    font-size: 15px;
    outline: none;
  }
  #input-row input:focus { border-color: var(--accent); }
  #input-row button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #input-row button:disabled { opacity: 0.5; cursor: default; }
  #header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 56px 16px 16px;
    background: linear-gradient(135deg, #ec6a92 0%, #f5a679 100%);
  }
  #header img {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 2px solid #ffffff;
  }
  #header-text {
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.3;
  }
  #header-subtext {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.9);
  }
  #portfolio-link {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: #ffffff;
    padding: 6px 12px;
    border-radius: 20px;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #portfolio-link:hover {
    opacity: 0.9;
  }
  #footer-note {
    text-align: center;
    font-size: 11px;
    color: #98a2b3;
    padding: 6px 16px 10px;
  }
</style>
</head>
<body>

<div id="chat-container">
  <div id="header">
    <img src="sabrina.jpg" alt="Sabrina" />
    <div style="flex: 1;">
      <div id="header-text">Sabrina's AI</div>
      <div id="header-subtext">Chat with me</div>
    </div>
    <a id="portfolio-link" href="https://sabrinadesigns.ai/all-work" target="_blank" rel="noopener noreferrer">My Portfolio ↗</a>
  </div>
  <div id="messages"></div>
  <div id="starter-questions">
    <button class="starter-btn" data-q="How do you actually work? What's your process?">🔍 How I actually work</button>
    <button class="starter-btn" data-q="Where could you help my team or organization?">🎯 Where I could help you?</button>
    <button class="starter-btn" data-q="Why did you build this AI agent?">🤖 Why am I an AI agent?</button>
  </div>
  <div id="input-row">
    <input type="text" id="user-input" placeholder="Ask me anything..." autocomplete="off" />
    <button id="send-btn">Send ➤</button>
  </div>
  <div id="footer-note">Conversations may be reviewed to improve this assistant.</div>
</div>

<script>
  // Point this at your deployed Netlify function URL, e.g.
  // https://your-site-name.netlify.app/.netlify/functions/chat
  const CHAT_ENDPOINT = "https://gentle-meringue-b058c8.netlify.app/.netlify/functions/chat";

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const starterQuestions = document.getElementById('starter-questions');

  // Simple session ID so logged rows for one visit can be grouped together.
  const sessionId = 'session_' + Math.random().toString(36).slice(2) + '_' + Date.now();

  let conversation = []; // { role: 'user' | 'assistant', content: string }

  // Escapes raw text for safe HTML insertion, then converts **bold**
  // markdown into real <strong> tags, and auto-links any http(s) URLs into
  // clickable anchors. Used only for agent messages — user-typed text
  // stays as plain textContent for safety.
  function escapeHtml(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function autoLinkUrls(html) {
    // Catch full URLs with protocol first...
    let linked = html.replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );
    // ...then, as a safety net, catch bare domain-style links the model
    // might write without a protocol (e.g. "meetup.com/ux-basel-meetups"
    // or "www.example.com/page") and add https:// automatically. Only
    // matches text not already inside an <a> tag from the pass above.
    linked = linked.replace(
      /(^|[\s>])((?:www\.)?[a-z0-9-]+\.[a-z]{2,}\/[^\s<]*)/gi,
      (match, prefix, domain) => `${prefix}<a href="https://${domain}" target="_blank" rel="noopener noreferrer">${domain}</a>`
    );
    return linked;
  }

  function markdownToHtml(text) {
    const bolded = escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const italicized = bolded.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return autoLinkUrls(italicized);
  }

  function addMessage(role, text, animate, onDone) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'agent');
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    if (role === 'user') {
      div.textContent = text; // plain text only, never render user input as HTML
    } else if (animate) {
      typeOutText(div, text, onDone);
    } else {
      div.innerHTML = markdownToHtml(text);
      if (onDone) onDone();
    }
  }

  function typeOutText(el, text, onDone) {
    let i = 0;
    let output = '';
    let boldOpen = false;
    let italicOpen = false;
    const speed = 24; // ms per character — tweak for faster/slower typing
    function step() {
      if (i < text.length) {
        if (text[i] === '*' && text[i + 1] === '*') {
          output += boldOpen ? '</strong>' : '<strong>';
          boldOpen = !boldOpen;
          i += 2;
        } else if (text[i] === '*') {
          output += italicOpen ? '</em>' : '<em>';
          italicOpen = !italicOpen;
          i += 1;
        } else {
          output += escapeHtml(text[i]);
          i += 1;
        }
        let display = output;
        if (boldOpen) display += '</strong>';
        if (italicOpen) display += '</em>';
        el.innerHTML = display;
        messagesEl.scrollTop = messagesEl.scrollHeight;
        setTimeout(step, speed);
      } else {
        // Typing finished — do a final pass so any URLs in the message
        // become properly clickable links (links aren't wired up live
        // during the character-by-character animation).
        el.innerHTML = markdownToHtml(text);
        if (onDone) onDone();
      }
    }
    step();
  }

  function addTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.id = 'typing-indicator';
    div.textContent = 'typing...';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  // Parses a trailing [QUICK_REPLIES: "A" | "B" | "C"] marker off the end
  // of a message. Returns { cleanText, options } — options is an array
  // (possibly empty) of short strings to render as tappable buttons.
  function parseQuickReplies(text) {
    const match = text.match(/\n?\[QUICK_REPLIES:\s*(.+?)\]\s*$/i);
    if (!match) return { cleanText: text, options: [] };

    const cleanText = text.slice(0, match.index).trimEnd();
    const options = match[1]
      .split('|')
      .map((s) => s.trim().replace(/^["']|["']$/g, ''))
      .filter(Boolean);

    return { cleanText, options };
  }

  function renderQuickReplies(options) {
    if (!options.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';
    options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.className = 'quick-reply-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        wrap.remove(); // these options are now stale once one is picked
        sendMessage(opt);
      });
      wrap.appendChild(btn);
    });
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Parses a trailing [EMAIL_DRAFT: subject="..." | body="..."] marker off
  // the end of a message. Returns { cleanText, emailDraft } — emailDraft is
  // null if no marker was found.
  function parseEmailDraft(text) {
    const match = text.match(/\n?\[EMAIL_DRAFT:\s*subject="(.*?)"\s*\|\s*body="(.*?)"\s*\]\s*$/is);
    if (!match) return { cleanText: text, emailDraft: null };

    const cleanText = text.slice(0, match.index).trimEnd();
    const emailDraft = { subject: match[1], body: match[2] };
    return { cleanText, emailDraft };
  }

  function renderEmailDraft(emailDraft) {
    if (!emailDraft) return;
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies'; // reuse the same layout styling
    const link = document.createElement('a');
    link.className = 'quick-reply-btn';
    link.textContent = '📧 Send this email to Sabrina';
    link.href =
      'mailto:sabrinadesigns.ai@gmail.com' +
      '?subject=' + encodeURIComponent(emailDraft.subject) +
      '&body=' + encodeURIComponent(emailDraft.body);
    wrap.appendChild(link);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage(text) {
    if (!text.trim()) return;

    addMessage('user', text);
    conversation.push({ role: 'user', content: text });
    inputEl.value = '';
    sendBtn.disabled = true;
    starterQuestions.style.display = 'none';
    addTypingIndicator();

    try {
      const res = await fetch(CHAT_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversation, sessionId }),
      });

      const data = await res.json();
      removeTypingIndicator();

      if (!res.ok) {
        addMessage('agent', data.error || "Something went wrong — please try again.");
        return;
      }

      const { cleanText: afterQuickReplies, options } = parseQuickReplies(data.reply);
      const { cleanText, emailDraft } = parseEmailDraft(afterQuickReplies);
      addMessage('agent', cleanText, true, () => {
        renderQuickReplies(options);
        renderEmailDraft(emailDraft);
      });
      // Store the clean version (no markers) in history so the model isn't
      // confused by its own formatting syntax when it reads back context.
      conversation.push({ role: 'assistant', content: cleanText });
    } catch (err) {
      removeTypingIndicator();
      addMessage('agent', "I'm having trouble connecting right now — please try again in a moment.");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage(inputEl.value);
  });
  starterQuestions.addEventListener('click', (e) => {
    if (e.target.matches('.starter-btn')) {
      sendMessage(e.target.dataset.q);
    }
  });

  // Fixed greeting written by Sabrina — no API call needed to show it.
  const GREETING = "Hi there! Would you like to know more about me? Ask me anything!";

  window.addEventListener('DOMContentLoaded', () => {
    addMessage('agent', GREETING, true);
    // Add it to conversation history so the model knows the greeting (and
    // its AI disclosure) already happened — prevents it from repeating
    // the disclosure again on the visitor's first real message.
    conversation.push({ role: 'assistant', content: GREETING });
  });
</script>

</body>
</html>
